<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Caden's Christmas List</title>

<script>
if (window.location.hash === '#skip-intro') {
    document.documentElement.classList.add('skip-intro');
}
</script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

html.skip-intro .intro {
    display: none;
}

html.skip-intro .hero-backdrop-title,
html.skip-intro .character-container,
html.skip-intro .backpack-image {
    animation-delay: 0s;
    animation-duration: .6s;
}

body {
    position: relative;
    margin: 0;
    min-height: 230vh;
    overflow-x: hidden;
    overflow-y: auto;
    background: #0b0d0e;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    --bg-y: 0px;
    --scroll-depth: 0px;
}

body::after {
    content: "";
    position: absolute;
    inset-inline: 0;
    bottom: 0;
    height: clamp(320px, 55vh, 640px);
    z-index: 1000;
    pointer-events: none;
    background: linear-gradient(
        to bottom,
        rgba(11,13,14,0) 0%,
        rgba(11,13,14,.72) 58%,
        #0b0d0e 100%
    );
}

/* FAR BACKGROUND — moves much slower than the page */
.parallax-background {
    position: fixed;
    inset: -12vh 0;
    z-index: -20;
    background-image: url("background.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    transform: translate3d(0, var(--bg-y), 0) scale(1.06);
    will-change: transform;
}

/* slight cinematic atmosphere */
.parallax-background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(to bottom,
            rgba(0,0,0,.08) 0%,
            rgba(0,0,0,0) 45%,
            rgba(0,0,0,.18) 100%);
}

/* ==================================================
   FIRST SCENE
================================================== */

.hero {
    position: relative;
    min-height: 1080px;
    height: 108vh;
    padding-top: 100px;
    overflow: visible;
    isolation: isolate;
}

.hero h1 {
    display: none;
}

.hero-backdrop-title {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    z-index: 0;
    font-size: clamp(5rem, 13vw, 18rem);
    line-height: .82;
    font-weight: 900;
    letter-spacing: -.08em;
    text-transform: uppercase;
    white-space: nowrap;
    color: rgba(255,255,255,.14);
    text-shadow:
        0 0 24px rgba(255,255,255,.12),
        0 24px 70px rgba(0,0,0,.75);
    pointer-events: none;
    animation: titleReveal 1.2s cubic-bezier(.16,1,.3,1) 4.4s backwards;
}

.hero-scene {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    transform: translate3d(0, calc(var(--scroll-depth) * -0.22), 0);
    transition: transform .18s ease-out;
}

.character-container {
    position: relative;
    display: inline-block;
    width: fit-content;
    z-index: 5;
    margin-top: 52px;

    opacity: 1;
    transition: opacity .35s ease;
    animation: characterIn 1.15s cubic-bezier(.16,1,.3,1) 4.35s backwards;
}

.character {
    position: relative;
    z-index: 2;
    height: 980px;
    width: auto;
    transition: transform .20s ease-in-out;
    transform-origin: center center;
}

.character.hovered {
    transform: scale(1.06);
}

/* single ground shadow for the character, aligned to the grass line */
.character-shadow {
    display: none;
}

/* ==================================================
   HOTSPOTS
================================================== */

.jacket {
    position: absolute;
    width: 280px;
    height: 300px;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    cursor: pointer;
}

.pants {
    position: absolute;
    width: 260px;
    height: 390px;
    top: 430px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    cursor: pointer;
}

.beanie {
    position: absolute;
    width: 90px;
    height: 80px;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    cursor: pointer;
}

/* ==================================================
   HOVER PRODUCT IMAGES
================================================== */

.jacket-image {
    position: fixed;
    height: 470px;
    width: auto;
    left: 300px;
    top: 50px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
}

.jacket-folded-image {
    position: fixed;
    height: 300px;
    width: auto;
    left: 400px;
    top: 300px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
}

.pants-image {
    position: fixed;
    height: 580px;
    width: auto;
    left: 300px;
    top: 450px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
}

.pants-folded-image {
    position: fixed;
    height: 300px;
    width: auto;
    left: 130px;
    top: 680px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 100;
}

.beanie-image {
    position: fixed !important;
    height: 180px !important;
    width: auto !important;
    left: 1100px !important;
    top: 80px !important;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease-in-out;
    z-index: 9999 !important;
}

/* ==================================================
   CLOSED BACKPACK — now part of foreground scene
================================================== */

.backpack-image {
    position: absolute;
    height: 430px;
    width: auto;
    right: 260px;
    bottom: 70px;
    z-index: 6;
    cursor: pointer;

    opacity: 1;
    transform: translateX(0) scale(1);
    animation: backpackIn 1.1s cubic-bezier(.16,1,.3,1) 4.65s backwards;

    transition:
        transform .20s ease-in-out,
        opacity .65s ease-in-out;
}

.hero-scene .character-container,
.hero-scene .backpack-image {
    transition:
        transform .28s ease-in-out,
        opacity .22s ease-out;
}

.backpack-image:hover {
    transform: scale(1.12);
}

/* ==================================================
   OPEN BACKPACK
================================================== */

.open-backpack-image {
    position: fixed;
    left: -120px;
    bottom: -180px;
    height: 950px;
    width: auto;
    z-index: 100;
    opacity: 1;
    transform: translateX(-110%);
    pointer-events: none;
    transition: transform .70s ease-in-out;
}

.backpack-lid {
    position: fixed;
    left: 40px;
    bottom: 500px;
    width: 520px;
    height: 220px;
    z-index: 200;
    cursor: pointer;
    display: none;
}

.loot-layer {
    position: fixed;
    inset: 0;
    z-index: 160;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s ease;
}

.loot-item {
    position: absolute;
    left: var(--start-x);
    top: var(--start-y);
    width: var(--w);
    height: auto;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transform: translate(-50%, -50%) scale(.4) rotate(var(--start-rot));
    filter: drop-shadow(0 10px 16px rgba(0,0,0,.28));
    transition: transform .24s ease-in-out;
}

.item-shoes {
    --start-x: 230px;
    --start-y: 265px;
    --end-x: 66vw;
    --end-y: 22vh;
    --start-rot: -18deg;
    --w: 230px;
    --arc-1x: 20px;
    --arc-1y: 90px;
    --delay: 0.05s;
}

.item-booties {
    --start-x: 330px;
    --start-y: 242px;
    --end-x: 80vw;
    --end-y: 23vh;
    --start-rot: -12deg;
    --w: 210px;
    --arc-1x: 28px;
    --arc-1y: 115px;
    --delay: 0.14s;
}

.item-gloves {
    --start-x: 420px;
    --start-y: 260px;
    --end-x: 72vw;
    --end-y: 49vh;
    --start-rot: 12deg;
    --w: 190px;
    --arc-1x: 18px;
    --arc-1y: 88px;
    --delay: 0.23s;
}

.item-sleeping-pad {
    --start-x: 520px;
    --start-y: 275px;
    --end-x: 89vw;
    --end-y: 49vh;
    --start-rot: 16deg;
    --w: 290px;
    --arc-1x: 20px;
    --arc-1y: 74px;
    --delay: 0.32s;
}

.item-socks {
    --start-x: 620px;
    --start-y: 285px;
    --end-x: 68vw;
    --end-y: 74vh;
    --start-rot: 22deg;
    --w: 200px;
    --arc-1x: 20px;
    --arc-1y: 120px;
    --delay: 0.41s;
}

.item-tent {
    --start-x: 720px;
    --start-y: 300px;
    --end-x: 86vw;
    --end-y: 79vh;
    --start-rot: 28deg;
    --w: 300px;
    --arc-1x: 18px;
    --arc-1y: 120px;
    --delay: 0.5s;
}

@keyframes lootLaunch {
    0% {
        opacity: 0;
        left: var(--start-x);
        top: var(--start-y);
        transform: translate(-50%, -50%) scale(.35) rotate(var(--start-rot));
    }
    16% {
        opacity: 1;
    }
    42% {
        opacity: 1;
        left: calc(var(--start-x) + var(--arc-1x));
        top: calc(var(--start-y) - var(--arc-1y));
        transform: translate(-50%, -50%) scale(.85) rotate(calc(var(--start-rot) * .35));
    }
    100% {
        opacity: 1;
        left: var(--end-x);
        top: var(--end-y);
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }
}

@keyframes lootRepack {
    0% {
        opacity: 1;
        left: var(--end-x);
        top: var(--end-y);
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }
    28% {
        opacity: 1;
        left: calc(var(--end-x) - var(--arc-1x) * 0.5);
        top: calc(var(--end-y) - var(--arc-1y) * 0.65);
        transform: translate(-50%, -50%) scale(.95) rotate(calc(var(--start-rot) * .2));
    }
    62% {
        opacity: 1;
        left: calc(var(--start-x) + var(--arc-1x) * 0.7);
        top: calc(var(--start-y) - var(--arc-1y) * 0.35);
        transform: translate(-50%, -50%) scale(.72) rotate(calc(var(--start-rot) * .6));
    }
    100% {
        opacity: 0;
        left: var(--start-x);
        top: var(--start-y);
        transform: translate(-50%, -50%) scale(.22) rotate(var(--start-rot));
    }
}

body.backpack-opening .loot-layer {
    opacity: 0;
    pointer-events: none;
}

body.backpack-closing .loot-layer {
    opacity: 1;
    pointer-events: none;
}

body.backpack-open .loot-layer {
    opacity: 1;
    pointer-events: auto;
}

body.loot-hidden .loot-layer {
    visibility: hidden;
}

body.loot-animate .loot-item {
    animation: lootLaunch 1.15s cubic-bezier(.18, .9, .25, 1) forwards;
    animation-fill-mode: forwards;
    animation-delay: calc(var(--delay) + 0.2s);
    pointer-events: auto;
}

body.loot-unpacked:not(.backpack-closing) .loot-item:hover {
    transform: translate(-50%, -50%) scale(1.06) rotate(0deg) !important;
}

body.backpack-closing .loot-item {
    opacity: 1;
    pointer-events: none;
    animation: lootExit 1.1s cubic-bezier(.2, .65, .3, 1) forwards;
}

@keyframes lootExit {
    from {
        left: var(--end-x);
        top: var(--end-y);
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }
    to {
        left: calc(var(--end-x) + 60vw);
        top: var(--end-y);
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
    }
}

/* ==================================================
   BACKPACK STATES
================================================== */

body.backpack-opening .character-container,
body.backpack-open .character-container {
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
}

body.backpack-opening .character,
body.backpack-open .character {
    opacity: 0;
    transition: opacity .35s ease;
}

body.backpack-opening .character-shadow,
body.backpack-open .character-shadow {
    opacity: 0;
    transition: opacity .35s ease;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.42);
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    transition: opacity .45s ease;
}

body.backpack-opening::before,
body.backpack-open::before {
    opacity: 1;
}

body.backpack-closing::before {
    opacity: 1;
}

body.backpack-closing.backpack-returning::before {
    opacity: 0;
    transition: opacity .45s ease;
}

body.backpack-opening .backpack-image {
    opacity: 0;
    transform: translateX(100vw) scale(1);
    pointer-events: none;
    transition:
        transform .75s ease-in-out,
        opacity .65s ease-in-out;
}

body.backpack-opening .open-backpack-image {
    transform: translateX(0);
}

body.backpack-open .backpack-image {
    opacity: 0;
    transform: translateX(100vw) scale(1);
    pointer-events: none;
}

body.backpack-open .open-backpack-image {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}

body.backpack-open .backpack-lid {
    display: block;
}

body.backpack-closing .character-container {
    opacity: 0;
    pointer-events: none;
}

body.backpack-closing .character {
    opacity: 0;
    transition: opacity .35s ease;
}

body.backpack-closing.backpack-returning .character-container {
    opacity: 1;
    transition: opacity .35s ease;
}

body.backpack-closing.backpack-returning .character {
    opacity: 1;
    transition: opacity .35s ease;
}

body.backpack-closing .open-backpack-image {
    opacity: 1;
    transform: translateX(0);
    pointer-events: none;
    transition: transform .70s ease-in-out;
}

body.backpack-closing.backpack-returning .open-backpack-image {
    opacity: 1;
    transform: translateX(-110%);
    pointer-events: none;
    transition: transform .70s ease-in-out;
}

body.backpack-closing .backpack-image {
    opacity: 0;
    transform: translateX(120vw);
    pointer-events: none;
    transition:
        transform .95s cubic-bezier(.16,1,.3,1),
        opacity .55s ease-in-out;
}

body.backpack-closing.backpack-returning .backpack-image {
    opacity: 1;
    transform: translateX(0);
    transition:
        transform 1.25s cubic-bezier(.16,1,.3,1),
        opacity .65s ease-in-out;
}

/* ==================================================
   EPIC INTRO
================================================== */

.intro {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(4px);
    overflow: hidden;
    pointer-events: auto;
    animation: introDisappear 5s ease forwards;
}

.intro-title {
    width: 100%;
    text-align: center;
    color: white;
}

.intro-caden {
    font-size: 80px;
    font-weight: 900;
    letter-spacing: 20px;
    opacity: 0;
    transform: translateX(-100vw);
    animation: flyFromLeft 1.1s cubic-bezier(.16,1,.3,1) .3s forwards;
}

.intro-christmas {
    font-size: 120px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 8px;
    white-space: nowrap;
    opacity: 0;
    transform: translateX(100vw);
    animation: flyFromRight 1.1s cubic-bezier(.16,1,.3,1) .5s forwards;
}

.intro-line {
    height: 3px;
    width: 0;
    margin: 28px auto 18px;
    background: white;
    animation: drawLine .8s ease 1.4s forwards;
}

.intro-subtitle {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 10px;
    opacity: 0;
    animation: subtitleAppear .7s ease 1.7s forwards;
}

.pants-outro {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: grid;
    place-items: center;
    background: #000;
    color: #fff;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .65s ease, visibility 0s linear .65s;
}

body.pants-outro-active .pants-outro,
body.beanie-outro-active .pants-outro,
body.shoes-outro-active .pants-outro {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .65s ease;
}

.pants-outro-line {
    position: absolute;
    margin: 0;
    padding: 0 24px;
    font-size: clamp(2.5rem, 8vw, 7rem);
    font-weight: 900;
    line-height: 1;
    text-align: center;
    opacity: 0;
    transform: translateY(18px);
}

body.pants-outro-active .pants-outro-size {
    animation: pantsOutroSize 5s ease both;
}

body.pants-outro-active .pants-outro-thanks {
    animation: pantsOutroThanks 5s ease both;
}

body.beanie-outro-active .pants-outro-size {
    display: none;
}

body.beanie-outro-active .pants-outro-thanks {
    animation: beanieOutroThanks 3.5s ease both;
}

body.shoes-outro-active .pants-outro-size,
body.shoes-outro-active .pants-outro-thanks {
    display: none;
}

body.shoes-outro-active .shoes-outro-size,
body.shoes-outro-active .shoes-outro-color,
body.shoes-outro-active .shoes-outro-thanks {
    display: block;
}

body.shoes-outro-active .shoes-outro-size {
    animation: shoesOutroSize 8s ease both;
}

body.shoes-outro-active .shoes-outro-color {
    animation: shoesOutroColor 8s ease both;
}

body.shoes-outro-active .shoes-outro-thanks {
    animation: shoesOutroThanks 8s ease both;
}

@keyframes pantsOutroSize {
    0%, 100% { opacity: 0; transform: translateY(18px); }
    10%, 42% { opacity: 1; transform: translateY(0); }
    50% { opacity: 0; transform: translateY(-14px); }
}

@keyframes pantsOutroThanks {
    0%, 48%, 100% { opacity: 0; transform: translateY(18px); }
    58%, 88% { opacity: 1; transform: translateY(0); }
    96% { opacity: 0; transform: translateY(-14px); }
}

@keyframes beanieOutroThanks {
    0%, 100% { opacity: 0; transform: translateY(18px); }
    18%, 76% { opacity: 1; transform: translateY(0); }
    92% { opacity: 0; transform: translateY(-14px); }
}

@keyframes shoesOutroSize {
    0%, 100% { opacity: 0; transform: translateY(18px); }
    7%, 24% { opacity: 1; transform: translateY(0); }
    32% { opacity: 0; transform: translateY(-14px); }
}

@keyframes shoesOutroColor {
    0%, 34%, 100% { opacity: 0; transform: translateY(18px); }
    40%, 56% { opacity: 1; transform: translateY(0); }
    64% { opacity: 0; transform: translateY(-14px); }
}

@keyframes shoesOutroThanks {
    0%, 66%, 100% { opacity: 0; transform: translateY(18px); }
    72%, 90% { opacity: 1; transform: translateY(0); }
    97% { opacity: 0; transform: translateY(-14px); }
}

/* ==================================================
   SECOND SECTION — proves the page really scrolls
================================================== */

.gear-section {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 30px;
    transform: translate3d(0, calc(var(--scroll-depth) * 0.04), 0);
}

.product-grid {
    position: relative;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px;
    max-width: 1200px;
    margin: 0 auto 120px;
    padding: 0 28px 120px;
}

.product-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 420px;
    padding: 28px 24px 30px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(7,10,11,.48);
    backdrop-filter: blur(8px);
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}

a.product-card {
    color: inherit;
    text-decoration: none;
}

.product-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255,255,255,.25);
    box-shadow: 0 22px 60px rgba(0,0,0,.32);
}

.product-card .tag {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: 18px;
}

.product-card h3 {
    margin: 0;
    font-size: clamp(2rem, 2vw, 3rem);
    line-height: 1;
}

.product-card p {
    margin: 0;
    max-width: 24ch;
    line-height: 1.6;
    opacity: .75;
}

.gear-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(7,10,11,0) 0%,
        rgba(7,10,11,.58) 35%,
        rgba(7,10,11,.88) 100%
    );
    z-index: -1;
}

.reveal {
    opacity: 0;
    transform: translateY(100px) scale(.94);
    filter: blur(8px);
    transition:
        opacity 1s cubic-bezier(.16,1,.3,1),
        transform 1s cubic-bezier(.16,1,.3,1),
        filter 1s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
}

.gear-copy .eyebrow {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 10px;
    opacity: .72;
    margin-bottom: 16px;
}

.gear-copy h2 {
    margin: 0;
    font-size: clamp(70px, 10vw, 160px);
    line-height: .88;
    font-weight: 900;
    letter-spacing: -5px;
    text-shadow: 0 0 14px rgba(255,255,255,.55), 0 0 38px rgba(255,207,112,.4);
}

.gear-copy p {
    margin: 28px auto 0;
    max-width: 650px;
    font-size: 18px;
    line-height: 1.6;
    opacity: .75;
}

/* ==================================================
   ENTRANCE KEYFRAMES
================================================== */

@keyframes smallTitleIn {
    from {
        opacity: 0;
        transform: translateY(-45px);
        letter-spacing: 12px;
    }
    to {
        opacity: 1;

/* CHARACTER HOTSPOT HOVER */
const characterParts = document.querySelectorAll('.jacket, .pants, .beanie');

characterParts.forEach(part => {
    part.addEventListener('mouseenter', () => {
        character.classList.add('hovered');
    });

    part.addEventListener('mouseleave', () => {
        character.classList.remove('hovered');
    });
});

/* OPEN BACKPACK */
backpack.addEventListener('click', () => {
    if (
        document.body.classList.contains('backpack-opening') ||
        document.body.classList.contains('backpack-open') ||
        document.body.classList.contains('backpack-closing')
    ) {
        return;
    }

    document.body.classList.remove('loot-animate');
    document.body.classList.remove('loot-unpacked');
    document.body.classList.add('loot-hidden');
    document.body.classList.add('backpack-opening');

    setTimeout(() => {
        document.body.classList.remove('backpack-opening');
        document.body.classList.add('backpack-open');
        setTimeout(() => {
            document.body.classList.add('loot-animate');
            document.body.classList.remove('loot-hidden');
            setTimeout(() => {
                document.body.classList.add('loot-unpacked');
            }, 1900);
        }, 120);
    }, 750);
});

/* CLOSE BACKPACK */
backpackLid.addEventListener('click', () => {
    if (!document.body.classList.contains('backpack-open')) {
        return;
    }

    document.body.classList.remove('backpack-open');
    document.body.classList.remove('loot-unpacked');
    document.body.classList.add('backpack-closing');

    /* Keep unpacked items still while the backpack returns. */
    setTimeout(() => {
        document.body.classList.add('backpack-returning');
    }, 220);

    setTimeout(() => {
        document.body.classList.add('loot-hidden');
        document.body.classList.remove('loot-animate');
        document.body.classList.remove('backpack-closing');
        document.body.classList.remove('backpack-returning');
        document.body.classList.remove('loot-repack');
    }, 1500);
});

/* ==================================================
   SMOOTH PARALLAX
   Foreground scrolls normally.
   Alps only move 16% as far.
================================================== */

let currentBgY = 0;
let targetBgY = 0;
let parallaxRunning = false;

function setParallaxTarget() {
    targetBgY = -(window.scrollY * 0.16);
    document.body.style.setProperty('--scroll-depth', `${window.scrollY * 0.9}px`);

    const fadeStart = 120;
    const fadeAmount = Math.min(Math.max((window.scrollY - fadeStart) / 220, 0), 1);
    const heroCharacter = document.querySelector('.character-container');
    const heroBackpack = document.querySelector('.backpack-image');

    if (heroCharacter) {
        heroCharacter.style.opacity = String(1 - fadeAmount);
    }

    if (heroBackpack) {
        heroBackpack.style.opacity = String(1 - fadeAmount);
    }

    if (!parallaxRunning) {
        parallaxRunning = true;
        requestAnimationFrame(animateParallax);
    }
}

function animateParallax() {
    currentBgY += (targetBgY - currentBgY) * 0.10;

    document.body.style.setProperty(
        '--bg-y',
        currentBgY + 'px'
    );

    if (Math.abs(targetBgY - currentBgY) > 0.1) {
        requestAnimationFrame(animateParallax);
    } else {
        currentBgY = targetBgY;
        document.body.style.setProperty('--bg-y', currentBgY + 'px');
        parallaxRunning = false;
    }
}

if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
}

window.scrollTo(0, 0);
window.addEventListener('pageshow', () => window.scrollTo(0, 0), { once: true });
window.addEventListener('scroll', setParallaxTarget, { passive: true });
setParallaxTarget();

/* ==================================================
   SCROLL REVEALS
================================================== */

const revealObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
        }
    });
}, {
    threshold: 0.22
});

document.querySelectorAll('.reveal').forEach(element => {
    revealObserver.observe(element);
});
