<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Already Have | Caden's Christmas List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            background:
                linear-gradient(rgba(0, 0, 0, .86), rgba(0, 0, 0, .86)),
                url("background.png") center / cover no-repeat fixed;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .back-button {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 2;
            display: grid;
            width: 52px;
            aspect-ratio: 1;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .34);
            background: rgba(0, 0, 0, .46);
            color: #fff;
            font-size: 30px;
            line-height: 1;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: background .2s ease, border-color .2s ease;
        }

        .back-button:hover {
            border-color: rgba(255, 255, 255, .72);
            background: rgba(0, 0, 0, .72);
        }

        .back-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .page-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            min-height: 100svh;
        }

        .portrait-stage {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-width: 0;
            overflow: hidden;
        }

        .portrait-stage img {
            display: block;
            width: 100%;
            height: 94vh;
            height: 94svh;
            object-fit: contain;
            object-position: center bottom;
            opacity: 0;
            transform: translateX(-9vw);
            animation: portraitArrive 1.25s cubic-bezier(.16, 1, .3, 1) .12s forwards;
        }

        .page-content {
            align-self: center;
            min-width: 0;
            padding: 0 clamp(24px, 5vw, 88px) 0 20px;
        }

        .page-title {
            margin: 0;
            font-size: 5rem;
            font-weight: 900;
            line-height: .9;
            text-transform: uppercase;
            text-shadow: 0 8px 44px rgba(0, 0, 0, .65);
            animation: titleArriveAndFade 1.7s ease both;
        }

        .item-checklist {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 16px;
            margin: 0;
            padding: 0;
            list-style: none;
            opacity: 0;
            transform: translateY(16px);
            animation: checklistReveal .7s ease 1.7s forwards;
        }

        .item-checklist li {
            display: grid;
            grid-template-columns: 19px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .18);
            background: rgba(0, 0, 0, .2);
            text-align: left;
        }

        .item-checklist a,
        .item-checklist span {
            color: rgba(255, 255, 255, .88);
            font-size: 15px;
        }

        .item-checklist a {
            text-decoration: none;
            cursor: pointer;
        }

        .item-checklist a:hover {
            color: #fff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .item-checklist a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .item-checklist input {
            display: grid;
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            margin: 0;
            place-content: center;
            appearance: none;
            border: 2px solid rgba(255, 255, 255, .95);
            border-radius: 3px;
            background: rgba(255, 255, 255, .12);
            opacity: 1;
            cursor: default;
        }

        .item-checklist input:checked {
            border-color: #e4c27f;
            background: #e4c27f;
        }

        .item-checklist input:checked::after {
            width: 7px;
            height: 12px;
            border: solid #17130d;
            border-width: 0 3px 3px 0;
            content: "";
            transform: rotate(45deg) translate(-1px, -1px);
        }

        @keyframes portraitArrive {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes titleArriveAndFade {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }
            26%, 59% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-24px);
            }
        }

        @keyframes checklistReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            body {
                overflow: auto;
            }

            .page-layout {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) auto;
                min-height: 100vh;
                min-height: 100svh;
                padding: 0 18px 12vh;
            }

            .portrait-stage {
                min-height: 58vh;
                min-height: 58svh;
            }

            .portrait-stage img {
                width: min(100%, 560px);
                height: 58vh;
                height: 58svh;
                transform: translateX(-18vw);
            }

            .page-content {
                justify-self: stretch;
                padding: 0;
            }

            .page-title {
                font-size: 3rem;
                text-align: center;
            }

            .item-checklist {
                gap: 6px 10px;
                margin-top: 20px;
            }

            .item-checklist li {
                grid-template-columns: 17px minmax(0, 1fr);
                gap: 7px;
                min-height: 42px;
                padding: 6px;
            }

            .item-checklist a,
            .item-checklist span {
                font-size: 13px;
            }

            .item-checklist input {
                width: 22px;
                height: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
